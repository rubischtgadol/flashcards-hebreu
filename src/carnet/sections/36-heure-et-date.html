<h2 id="sec-heure-et-date"><span lang="he">מָה הַשָּׁעָה?</span> <span class="count">Heure et date</span></h2>
<div class="note">
  Les compléments de temps se construisent avec <span lang="he">בְּ</span> + article : <span lang="he">בַּבֹּקֶר</span> (baboker) = « le matin ».<br><br>
  <span lang="he">שָׁעָה</span> et <span lang="he">דַּקָּה</span> restent des noms au carnet (section Noms) ; cette section ne porte que les compléments de temps.
</div>

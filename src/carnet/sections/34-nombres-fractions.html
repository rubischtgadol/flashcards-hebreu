<h2 id="sec-nombres-fractions"><span lang="he">חֵצִי וְרֶבַע</span> <span class="count">Nombres — fractions et multiplicatifs</span></h2>
<div class="note">
  Une fraction se dit avec le nom du rang — <span lang="he">חֵצִי</span> (demi), <span lang="he">שְׁלִישׁ</span> (tiers), <span lang="he">רֶבַע</span> (quart) — jamais avec un cardinal suivi d'un mot « partie ».<br><br>
  <span lang="he">פִּי</span> multiplie : <span lang="he">פִּי שְׁנַיִם</span> (pi shnayim) = le double, deux fois plus.
</div>

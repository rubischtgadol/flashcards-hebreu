<h2 id="sec-tournures-impersonnelles"><span lang="he">קַר לִי</span> <span class="count">Tournures impersonnelles</span></h2>
<div class="note">
  Le français met un sujet (« j'ai froid ») ; l'hébreu met une préposition fléchie (« froid à-moi »). La série complète de <span lang="he">לְ</span> est enseignée à la section « Prépositions fléchies ». <span lang="he">נִדְמֶה</span> et <span lang="he">כְּדַאי</span> vivent chez les verbes modaux.
</div>
